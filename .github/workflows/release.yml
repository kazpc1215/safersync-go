name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # クロスコンパイル（CGO_ENABLED=0）なので linux でビルドできる。Makefile は
    # sha256sum を優先し shasum にフォールバックするため OS を問わない。macOS の
    # arm64 ランナーはキュー混雑の通知が出るため linux を使う。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # formula を main へ同期するため main を取得する
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: タグとバージョンの一致を確認
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$(grep -m1 'VERSION := ' Makefile | cut -d' ' -f3)" ]; then
            echo "✗ タグ v$TAG と Makefile の VERSION が一致しません" >&2
            exit 1
          fi
      - name: リリース物のビルド（tarball + SHA256SUMS）
        run: make release
      - name: Homebrew formula を生成（このリリースの sha256 で）
        run: make formula
      - name: GitHub Release へ添付
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
            packaging/homebrew/safersync.rb
          generate_release_notes: true
      # リポジトリの formula を常に最新リリースと一致させる。
      # （GITHUB_TOKEN が起こした release イベントでは別ワークフローが起動しないため、
      #   ここで直接 main へコミットする。この push で CI は走らないが、対象は
      #   formula（データ）のみで、実物の sha256 は上のステップで検証済み。）
      - name: Homebrew formula を main へ同期
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          git checkout -- packaging/homebrew/safersync.rb
          git fetch origin main
          git checkout -B main origin/main
          # 古いタグの再リリースで巻き戻さない
          # （version 行は廃止したので URL から取る。例: .../download/v1.5.3/...）
          cur=$(sed -n 's|.*/download/v\([^/]*\)/.*|\1|p' packaging/homebrew/safersync.rb | head -1)
          if [ "$(printf '%s\n%s\n' "$cur" "$TAG" | sort -V | tail -1)" != "$TAG" ]; then
            echo "tag v$TAG は formula の v$cur より古いため同期をスキップします"
            exit 0
          fi
          sh packaging/homebrew/update-formula.sh dist/release/SHA256SUMS "$TAG"
          if git diff --quiet -- packaging/homebrew/safersync.rb; then
            echo "formula は最新です（変更なし）"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/homebrew/safersync.rb
          git commit -m "chore: sync Homebrew formula with ${GITHUB_REF_NAME}"
          git push origin main
      # tap リポジトリ（別リポジトリ）へ formula を反映する。
      # 別リポジトリへ push できるトークンが要るため、リポジトリ Secrets に
      # TAP_GITHUB_TOKEN（tap への push 権を持つ PAT）があるときだけ実行する。
      # 未設定なら何もせず終了する（README のとおり手動で同期する）。
      - name: Homebrew tap へ formula を同期
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_GITHUB_TOKEN が未設定のためスキップします（tap は手動で同期してください）"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          work="$(mktemp -d)"
          # トークンをクローン URL に埋め込むと、プロセス一覧や git のエラーログに
          # 残る可能性がある。credential.helper（環境変数 TAP_TOKEN を参照）に
          # 渡し、URL にはトークンを含めない。
          helper='!f() { echo username=x-access-token; echo "password=${TAP_TOKEN}"; }; f'
          git -c credential.helper="$helper" clone --quiet \
            https://github.com/kazpc1215/homebrew-tap.git "$work/tap"
          cd "$work/tap"
          git config credential.helper "$helper"
          cp "$GITHUB_WORKSPACE/packaging/homebrew/safersync.rb" Formula/safersync.rb
          # 古いタグの再リリースで tap を巻き戻さない
          cur=$(sed -n 's|.*/download/v\([^/]*\)/.*|\1|p' Formula/safersync.rb | head -1)
          if [ -n "$cur" ] && [ "$(printf '%s\n%s\n' "$cur" "$TAG" | sort -V | tail -1)" != "$TAG" ]; then
            echo "tag v$TAG は tap の v$cur より古いため同期をスキップします"
            exit 0
          fi
          if git diff --quiet -- Formula/safersync.rb; then
            echo "tap の formula は最新です（変更なし）"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/safersync.rb
          git commit -m "safersync ${TAG}"
          git push origin HEAD:main
