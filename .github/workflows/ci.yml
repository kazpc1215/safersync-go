name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Go 版のゲート（bash 版 shellcheck テストの代替）
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: gofmt（整形ずれの検出）
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: staticcheck（未使用コード・バグ検出）
        # ピンは再現性のため固定。v0.8.2 = 2026.2.2 が現時点の最新リリース。
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: テスト（race + カバレッジ）
        run: |
          go test -count=1 -race -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1
      - name: ビルドと動作確認（単一バイナリ）
        run: |
          go build -trimpath -ldflags "-s -w" -o safersync .
          ./safersync --version
          file safersync
      - name: install.sh のスモークテスト（ネットワーク不要）
        run: sh scripts/test-install.sh
      - name: shellcheck（install.sh / scripts）
        # shellcheck は ubuntu ランナーに同梱。無ければ入れる（macOS は brew が要るため対象外）
        if: runner.os == 'Linux'
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi
          shellcheck install.sh scripts/test-install.sh

  # bash 版の bats テストを回帰テストとして実行する
  # （bin/safersync を Go バイナリへ差し替える方式。ローカル検証と同じ手順）
  bats-regression:
    runs-on: macos-latest
    # 日本語のテスト名を正しく slug 化するため UTF-8 ロケールを明示
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: bash 版（テストスイートのソース）を取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: kazpc1215/safersync
          path: bash
          # 上流は凍結済みだが、再現性のため main の特定コミットへ固定する
          # （上流の追加変更で CI が不安定にならないように）。
          ref: 40d9e40beb9979f226eeafd1c334ccef3b2edcee
      - name: bats と shellcheck を導入（bats を bash 5 で動かすため bash も入れる）
        run: |
          brew install bats-core shellcheck bash
          bash --version | head -1
          which bash
      - name: Go バイナリを差し替えて bats 実行（exFAT テストを含む）
        run: |
          rm -rf /tmp/ss-bats
          cp -R bash /tmp/ss-bats
          rm /tmp/ss-bats/bin/safersync
          go build -o /tmp/ss-bats/bin/safersync .
          # bash 版テストは --version の期待値を v1.2.0 で固定している。
          # bash 版は凍結済みのため、ここで VERSION ファイルの期待値へ差し替える。
          VERSION=$(cat internal/version/VERSION | tr -d '[:space:]')
          sed -i '' -e "s/v1\.2\.0/v$VERSION/g" /tmp/ss-bats/test/*.bats
          bats /tmp/ss-bats/test/*.bats
