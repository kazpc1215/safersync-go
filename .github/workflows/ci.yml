name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Go 版のゲート（bash 版 shellcheck テストの代替）
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt（整形ずれの検出）
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt が必要なファイル:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: ビルドと動作確認（単一バイナリ）
        run: |
          go build -trimpath -ldflags "-s -w" -o safersync .
          ./safersync --version
          file safersync

  # bash 版の bats テストを回帰テストとして実行する
  # （bin/safersync を Go バイナリへ差し替える方式。ローカル検証と同じ手順）
  bats-regression:
    runs-on: macos-latest
    # 日本語のテスト名を正しく slug 化するため UTF-8 ロケールを明示
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: bash 版（テストスイートのソース）を取得
        uses: actions/checkout@v4
        with:
          repository: kazpc1215/safersync
          path: bash
      - name: bats と shellcheck を導入（bats を bash 5 で動かすため bash も入れる）
        run: |
          brew install bats-core shellcheck bash
          bash --version | head -1
          which bash
      - name: Go バイナリを差し替えて bats 実行（exFAT テストを含む）
        run: |
          rm -rf /tmp/ss-bats
          cp -R bash /tmp/ss-bats
          rm /tmp/ss-bats/bin/safersync
          go build -o /tmp/ss-bats/bin/safersync .
          bats /tmp/ss-bats/test/*.bats
